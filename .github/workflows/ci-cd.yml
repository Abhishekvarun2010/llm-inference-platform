name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - app/**
      - tests/**
      - Dockerfile
      - pyproject.toml
      - poetry.lock
      - llm-inference-gitops/charts/**
      - .github/workflows/ci-cd.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/abhishekvarun2010/llm-inference-platform
  CHART_PATH: llm-inference-gitops/charts/inference-gateway
  LOCAL_VALUES: llm-inference-gitops/environments/local/values.yaml
  AWS_DEV_VALUES: llm-inference-gitops/environments/aws-dev/values.yaml

jobs:
  validate:
    name: Test and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==2.4.3

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run unit tests
        run: poetry run pytest -q

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm chart
        run: helm lint "$CHART_PATH" -f "$LOCAL_VALUES"

      - name: Render tag-based manifests
        run: |
          helm template inference-gateway "$CHART_PATH" \
            --namespace inference \
            > /tmp/tag-rendered.yaml
          grep -F 'image: "ghcr.io/abhishekvarun2010/llm-inference-platform:latest"' /tmp/tag-rendered.yaml

      - name: Render digest-based manifests
        run: |
          TEST_DIGEST="sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          helm template inference-gateway "$CHART_PATH" \
            --namespace inference \
            -f "$LOCAL_VALUES" \
            --set-string image.repository=ghcr.io/example/inference-gateway \
            --set-string image.digest="$TEST_DIGEST" \
            > /tmp/digest-rendered.yaml
          grep -F "image: \"ghcr.io/example/inference-gateway@$TEST_DIGEST\"" /tmp/digest-rendered.yaml

  publish:
    name: Publish immutable image
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update AWS development image digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          sed -i "s|^  digest:.*|  digest: \"${IMAGE_DIGEST}\"|" "$AWS_DEV_VALUES"

      - name: Commit GitOps digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if git diff --quiet -- "$AWS_DEV_VALUES"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$AWS_DEV_VALUES"
          git commit -m "chore(gitops): deploy image ${IMAGE_DIGEST}"
          git push origin HEAD:main
