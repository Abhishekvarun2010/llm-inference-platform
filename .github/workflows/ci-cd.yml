name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - app/**
      - tests/**
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - poetry.lock
      - llm-inference-gitops/charts/**
      - llm-inference-gitops/environments/**
      - llm-inference-gitops/applications/**
      - infrastructure/terraform/**
      - .github/workflows/ci-cd.yml
      - .github/workflows/application-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART_PATH: llm-inference-gitops/charts/inference-gateway
  LOCAL_VALUES: llm-inference-gitops/environments/local/values.yaml

jobs:
  validate:
    name: Test and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==2.4.3

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run unit tests
        run: poetry run pytest -q

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm chart
        run: helm lint "$CHART_PATH" -f "$LOCAL_VALUES"

      - name: Render tag-based manifests
        run: |
          helm template inference-gateway "$CHART_PATH" \
            --namespace inference \
            > /tmp/tag-rendered.yaml
          grep -F 'image: "ghcr.io/abhishekvarun2010/llm-inference-platform:latest"' /tmp/tag-rendered.yaml

      - name: Render digest-based manifests
        run: |
          TEST_DIGEST="sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          helm template inference-gateway "$CHART_PATH" \
            --namespace inference \
            -f "$LOCAL_VALUES" \
            --set-string image.repository=ghcr.io/example/inference-gateway \
            --set-string image.digest="$TEST_DIGEST" \
            > /tmp/digest-rendered.yaml
          grep -F "image: \"ghcr.io/example/inference-gateway@$TEST_DIGEST\"" /tmp/digest-rendered.yaml


  terraform:
    name: Validate Terraform (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - network
          - application
    defaults:
      run:
        working-directory: infrastructure/terraform/${{ matrix.stack }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.0"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without remote state
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate
