apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-inference-platform
  labels:
    app.kubernetes.io/name: llm-inference-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-inference-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-inference-platform
    spec:
      containers:
        - name: api
          image: llm-inference-platform:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: llm-inference-platform-config
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
