replicaCount: 1

rollout:
  revisionHistoryLimit: 2
  blueGreen:
    autoPromotionEnabled: false
    autoPromotionSeconds: null
    previewReplicaCount: 1
    scaleDownDelaySeconds: 30

image:
  repository: ghcr.io/abhishekvarun2010/llm-inference-platform
  tag: latest
  digest: ""
  pullPolicy: Always
  pullSecrets:
    - name: ghcr-pull-secret

inference:
  baseUrl: http://host.docker.internal:11434/v1
  apiKey: ollama
  model: qwen3:8b

service:
  type: NodePort
  port: 8000
  nodePort: 30080

previewService:
  type: ClusterIP
  port: 8000
  nodePort: null
