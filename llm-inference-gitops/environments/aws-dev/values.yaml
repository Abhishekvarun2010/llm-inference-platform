replicaCount: 2

image:
  repository: REPLACE_WITH_ECR_REGISTRY/llm-inference-platform
  tag: latest
  pullPolicy: Always

inference:
  baseUrl: http://ollama.ollama.svc.cluster.local:11434/v1
  apiKey: ollama
  model: qwen3:0.6b

service:
  type: ClusterIP
  port: 8000
  nodePort: null

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
