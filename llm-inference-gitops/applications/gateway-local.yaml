apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inference-gateway-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Abhishekvarun2010/llm-inference-platform.git
    targetRevision: main
    path: llm-inference-gitops/charts/inference-gateway
    helm:
      releaseName: llm-inference-platform
      valueFiles:
        - ../../environments/local/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: inference
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
