[project]
name = "llm-inference-platform"
version = "0.1.0"
description = "A platform for LLM inference"
authors = [
    {name = "Abhishekvarun2010"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.162.2,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "openai (>=3.49.0,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]
